<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<div class="d-flex align-items-center justify-content-center"
     style="min-height:100vh; background: radial-gradient(ellipse at 60% 40%, #1a0030 0%, #000 70%);">

    <div class="auth-card animate-in">

        <div class="auth-header text-center">
            <p class="label-xs mb-2" style="color:var(--purple-light);">Bienvenido de vuelta</p>
            <h1 class="serif text-white" style="font-size:2rem;" th:text="#{login.login}">Iniciar sesión</h1>
            <p class="small mt-2 mb-0" style="color:var(--text-muted);" th:text="#{aplicacion.titulo}">Scentia Store</p>
        </div>

        <div class="auth-body">

            <div th:if="${param.error != null}"
                 class="mb-4 p-3 animate-in"
                 style="background:rgba(231,76,60,0.08); border:1px solid rgba(231,76,60,0.3); color:#e74c3c; font-size:0.85rem;">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="#{error.login}">Credenciales incorrectas</span>
            </div>

            <div th:if="${param.logout != null}"
                 class="mb-4 p-3 animate-in"
                 style="background:rgba(39,174,96,0.08); border:1px solid rgba(39,174,96,0.3); color:#27ae60; font-size:0.85rem;">
                <i class="fas fa-check-circle me-2"></i>
                Sesión cerrada correctamente
            </div>

            <div th:if="${mensajeExito}"
                 class="mb-4 p-3 animate-in"
                 style="background:rgba(39,174,96,0.08); border:1px solid rgba(39,174,96,0.3); color:#27ae60; font-size:0.85rem;">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${mensajeExito}"></span>
            </div>

            <div th:if="${mensajeError}"
                 class="mb-4 p-3 animate-in"
                 style="background:rgba(231,76,60,0.08); border:1px solid rgba(231,76,60,0.3); color:#e74c3c; font-size:0.85rem;">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${mensajeError}"></span>
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-4">
                    <label class="label-xs d-block mb-2" th:text="#{login.username}">Correo electrónico</label>
                    <input type="text" name="username" class="form-control-dark w-100"
                           placeholder="tu@correo.com" required/>
                </div>

                <div class="mb-4">
                    <label class="label-xs d-block mb-2" th:text="#{login.password}">Contraseña</label>
                    <input type="password" name="password" class="form-control-dark w-100"
                           placeholder="••••••••" required/>
                </div>

                <div class="text-end mb-4">
                    <a th:href="@{/registro/recordar}"
                       class="text-decoration-none small"
                       style="color:var(--purple-light);"
                       th:text="#{accion.recordar}">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-luxury w-100">
                    <span th:text="#{login.login}">Ingresar</span>
                    <i class="fas fa-arrow-right ms-2"></i>
                </button>

            </form>

            <div class="text-center mt-4">
                <a th:href="@{/registro/nuevo}"
                   class="text-decoration-none small"
                   style="color:var(--text-secondary);">
                    ¿No tienes cuenta?
                    <span style="color:var(--purple-light); margin-left:4px;" th:text="#{accion.registrar}">Regístrate</span>
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
