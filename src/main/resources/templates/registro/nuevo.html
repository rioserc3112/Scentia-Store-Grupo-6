<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{general/fragmentos :: head}"/>

<body>

<div class="d-flex align-items-center justify-content-center"
     style="min-height:100vh; background: radial-gradient(ellipse at 40% 60%, #1a0030 0%, #000 70%);">

    <div class="auth-card animate-in">

        <div class="auth-header text-center">
            <p class="label-xs mb-2" style="color:var(--purple-light);">Únete a nosotros</p>
            <h1 class="serif text-white" style="font-size:2rem;" th:text="#{usuario.agregar}">Crear cuenta</h1>
            <p class="small mt-2 mb-0" style="color:var(--text-muted);" th:text="#{aplicacion.titulo}">Scentia Store</p>
        </div>

        <div class="auth-body">

            <div th:if="${mensajeError}"
                 class="mb-4 p-3 animate-in"
                 style="background:rgba(231,76,60,0.08); border:1px solid rgba(231,76,60,0.3); color:#e74c3c; font-size:0.85rem;">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${mensajeError}"></span>
            </div>

            <form th:action="@{/registro/nuevo}" method="post">

                <div class="mb-4">
                    <label class="label-xs d-block mb-2" th:text="#{usuario.nombre}">Nombre completo</label>
                    <input type="text" name="nombre" class="form-control-dark w-100"
                           placeholder="Tu nombre" required/>
                </div>

                <div class="mb-4">
                    <label class="label-xs d-block mb-2" th:text="#{usuario.correo}">Correo electrónico</label>
                    <input type="email" name="correo" class="form-control-dark w-100"
                           placeholder="tu@correo.com" required/>
                </div>

                <div class="mb-5">
                    <label class="label-xs d-block mb-2" th:text="#{usuario.password}">Contraseña</label>
                    <input type="password" name="password" class="form-control-dark w-100"
                           placeholder="Mínimo 8 caracteres" required/>
                </div>

                <button type="submit" class="btn-luxury w-100">
                    <span th:text="#{accion.registrar}">Crear mi cuenta</span>
                    <i class="fas fa-arrow-right ms-2"></i>
                </button>

            </form>

            <div class="text-center mt-4">
                <a th:href="@{/login}"
                   class="text-decoration-none small"
                   style="color:var(--text-secondary);">
                    ¿Ya tienes cuenta?
                    <span style="color:var(--purple-light); margin-left:4px;" th:text="#{login.login}">Inicia sesión</span>
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
